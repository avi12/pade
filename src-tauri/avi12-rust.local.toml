# Exemptions of this workspace from the house lint levels (rust-config-avi12), each with its reason

[clippy]
# Tauri #[command] functions must take owned arguments (String) and State by value: the framework deserializes into them
needless_pass_by_value = "allow"

[member.contextmenu-handler.rust]
# The COM context-menu handler is Win32 FFI
unsafe_code = "allow"

[member.contextmenu-handler.clippy]
# The #[implement] macro expands to helper impls that trip these two pedantic lints (a reference-to-raw-pointer cast,
# #[inline(always)]); they are generated, so they cannot be fixed at their source
ref_as_ptr = "allow"
inline_always = "allow"

[member.package-identity.rust]
# Win32 package identity calls
unsafe_code = "allow"

[member.process-job.rust]
# Win32 job objects
unsafe_code = "allow"

[member.process-priority.rust]
# Win32 process priority calls
unsafe_code = "allow"

[member.process-snapshot.rust]
# Win32 toolhelp snapshot
unsafe_code = "allow"

[member.webview-recovery.rust]
# WebView2 COM calls
unsafe_code = "allow"

[member.pade.rust]
# An application crate: nothing in it is public API outside this workspace, so item docs would only restate names
missing_docs = "allow"

[member.pade.clippy]
# Tauri #[command] functions take the injected app, window and state handles plus the frontend's arguments flat; the IPC shape is the signature
too_many_arguments = "allow"
# run() is dominated by the generate_handler! command registry, one flat list that cannot be split across functions
too_many_lines = "allow"
# SessionFacts mirrors the TypeScript wire type, one boolean per reported fact
struct_excessive_bools = "allow"
# ThemeConfig variants share the Spawn prefix because the prefix names the spawn-time contract
enum_variant_names = "allow"
# The non-embedded twin of write_embedded_handler must keep the fallible signature of the embedded one
unnecessary_wraps = "allow"
# The tungstenite handshake callback fixes its large Err type; it appears in the fake hub of a test
result_large_err = "allow"

[deny.advisories]
# Fixed in libsqlite3-sys 0.39, which rusqlite 0.40 (it asks for 0.38.1) does not accept yet; drop this on the next rusqlite release
ignore = ["RUSTSEC-2026-0459"]
