# PADE WebView2 crash-recovery shim.
#
# The one job of this crate: subscribe to WebView2's `ProcessFailed` COM event
# and translate it into a safe Rust callback. Registering a COM event handler
# and calling interface methods is `unsafe` in windows-rs, and the main `pade`
# crate forbids unsafe code - so, like `contextmenu-handler`, the unsafe lives
# in its own workspace member behind a safe API (`watch_process_failed`).
[package]
name = "webview-recovery"
version = "0.0.1"
description = "Safe wrapper over WebView2's ProcessFailed event for PADE's crash auto-recovery"
authors = ["Avi"]
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
# Pinned to the exact versions already in the lockfile via wry/Tauri, so no
# second copy compiles and the COM interface types are identical to the ones
# `tauri::webview::PlatformWebview` hands out (minimize-dependencies).
webview2-com = "0.39"
windows-core = "0.62"

# Same strict bar as the main crate (rust-best-practices), but this crate MUST
# allow unsafe: COM event registration is FFI. Everything else stays pedantic.

# avi12-lint:begin rust-config (generated from rust-config-avi12; edit avi12-rust.local.toml)
[lints.rust]
# WebView2 COM calls
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
unused_mut = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_must_use = "deny"
dead_code = "deny"
non_camel_case_types = "deny"
non_snake_case = "deny"
non_upper_case_globals = "deny"
# narrowest-visibility
unreachable_pub = "deny"
# public-api-docs
missing_docs = "deny"
[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Documentation of Result and panics is public-API prose; missing_docs covers the rest
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
# A pedantic hint that every pure function carry #[must_use]; rustc unused_must_use covers real results
must_use_candidate = "allow"
# no-unchecked-unwrap
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
# no-unchecked-cast
as_conversions = "deny"
cast_possible_truncation = "deny"
undocumented_unsafe_blocks = "deny"
# no-suppression
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# todo-needs-owner
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# identifier-length (the idioms are in clippy.toml)
min_ident_chars = "deny"
# early-return
needless_return = "deny"
redundant_else = "deny"
collapsible_else_if = "deny"
# size-limits, max-nesting (thresholds in clippy.toml)
cognitive_complexity = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
# no-floating-result
let_underscore_future = "deny"
# banned-apis (the list is in clippy.toml)
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
# Tauri #[command] functions must take owned arguments (String) and State by value: the framework deserializes into them
needless_pass_by_value = "allow"
# avi12-lint:end
