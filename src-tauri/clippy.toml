# Generated by avi12-lint rust-config from rust-config-avi12 and avi12-rust.local.toml; do not edit
# Thresholds and exemptions of the house rules for Rust; avi12-lint rust-config
# writes this file, merged with clippy.local.toml, next to the workspace manifest
# size-limits, max-nesting
cognitive-complexity-threshold = 20
too-many-lines-threshold = 100
# parameter-object: from six parameters a struct says what each one is
too-many-arguments-threshold = 5
# identifier-length: names of one or two characters fail, but for these idioms
min-ident-chars-threshold = 2
allowed-idents-below-min-chars = ["i", "j", "x", "y", "id", "to", "on", "ok", "Io", "T", "E"]
# no-unchecked-unwrap: a test may unwrap, expect, panic, index and print
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-dbg-in-tests = true
# banned-apis
disallowed-methods = []
disallowed-types = []
disallowed-macros = []
