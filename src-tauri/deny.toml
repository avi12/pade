# Generated by avi12-lint rust-config from rust-config-avi12 and avi12-rust.local.toml; do not edit

[graph]
targets = [{ triple = "x86_64-pc-windows-msvc" }]
all-features = true

[advisories]
unmaintained = "workspace"
yanked = "deny"
# Fixed in libsqlite3-sys 0.39, which rusqlite 0.40 (it asks for 0.38.1) does not accept yet; drop this on the next rusqlite release
ignore = ["RUSTSEC-2026-0459"]

[licenses]
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0"
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
