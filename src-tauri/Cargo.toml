[package]
name = "pade"
version = "0.19.27"
description = "PADE -Power ADE (Agentic Development Environment)"
authors = ["Avi"]
edition = "2021"
license = "Apache-2.0"

# `pade` is also the workspace root. `contextmenu-handler` is a separate cdylib
# (the Windows 11 modern-menu COM server) -NOT a dependency of `pade`, so a normal
# `cargo build`/`tauri dev` skips it; build it explicitly with
# `cargo build -p contextmenu-handler`. Being a member means it shares this
# `target/` dir, so its DLL lands next to `pade.exe` (where the sparse manifest
# expects both). Each crate keeps its own `[lints]` (this one forbids unsafe; the
# handler must allow it).
[workspace]
members = [
  "contextmenu-handler",
  "package-identity",
  "process-job",
  "process-priority",
  "process-snapshot",
  "webview-recovery"
]
resolver = "2"

[lib]
name = "pade_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
portable-pty = "0.8"
notify = "8"
rusqlite = { version = "0.40", features = ["bundled"] }
# PNG encoding for clipboard-image paste. Already in the tree transitively
# (arboard → image deps), so this adds no new supply-chain surface; the heavy
# `image` crate stays out.
png = "0.18"
# Copilot (copilot.com) session namer: a chat over a TLS WebSocket. `tungstenite`
# is the minimal blocking WS client; `ureq` the minimal blocking HTTPS client
# (session_context's model catalog); `sha2` fingerprints Codex hooks; `uuid`
# mints the chat ids. All pure-Rust, no OpenSSL.
ureq = { version = "3", default-features = false, features = ["rustls"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
# The PTY host's transport: a named pipe (Windows) / Unix socket between the app
# and the long-lived host process, plus the timers that bound every wait on it.
# Already in the tree through tauri (its async runtime); listed directly only to
# enable `net` and `time`, whose own dependencies (mio, socket2) are in the
# lockfile already - no new supply-chain surface.
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread", "sync", "time"] }

[target."cfg(windows)".dependencies]
# Windows process-priority FFI lives behind this safe helper because the main
# crate forbids unsafe code. Set before WebView2 and PTY children are spawned.
process-priority = { path = "process-priority" }
# The PTY host's kill-on-close job object (see src/terminal/pty_host/server.rs):
# unsafe FFI, so it lives in its own workspace member like process-priority.
process-job = { path = "process-job" }
# Task tracking's process-tree reads (see src/terminal/process_tree.rs): Toolhelp
# and per-process command lines, unsafe FFI in its own member like the two above.
process-snapshot = { path = "process-snapshot" }
# Whether PADE runs from its MSIX package (see src/platform/package.rs):
# `GetCurrentPackageFullName` is unsafe FFI, in its own member like the above.
package-identity = { path = "package-identity" }
# WebView2 `ProcessFailed` auto-recovery (see src/platform/recovery.rs). A separate
# workspace member because COM event registration is unsafe and this crate
# forbids unsafe code; it pins webview2-com/windows-core to the versions
# already in the tree via wry, so no new supply-chain surface.
webview-recovery = { path = "webview-recovery" }

[profile.release]
codegen-units = 1
lto = true
# This is an interactive, long-running desktop process. Favor runtime throughput
# (PTY, filesystem, and JSON work) over a small binary-size saving.
opt-level = 3
strip = true

# Strict lints -the Rust equivalent of the frontend's oxlint/eslint layers.
# `cargo clippy -- -D warnings` (see the lint:rust script) turns these into
# errors in CI/local, matching oxlint's correctness=error posture.

# avi12-lint:begin rust-config (generated from rust-config-avi12; edit avi12-rust.local.toml)
[workspace.lints.rust]
# warnings-are-errors, no-suppression, naming-case, no-unused, no-dead-code
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
unused_mut = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_must_use = "deny"
dead_code = "deny"
non_camel_case_types = "deny"
non_snake_case = "deny"
non_upper_case_globals = "deny"
# narrowest-visibility
unreachable_pub = "deny"
# public-api-docs
missing_docs = "deny"
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Documentation of Result and panics is public-API prose; missing_docs covers the rest
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
# A pedantic hint that every pure function carry #[must_use]; rustc unused_must_use covers real results
must_use_candidate = "allow"
# no-unchecked-unwrap
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
# no-unchecked-cast
as_conversions = "deny"
cast_possible_truncation = "deny"
undocumented_unsafe_blocks = "deny"
# no-suppression
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# todo-needs-owner
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# identifier-length (the idioms are in clippy.toml)
min_ident_chars = "deny"
# early-return
needless_return = "deny"
redundant_else = "deny"
collapsible_else_if = "deny"
# size-limits, max-nesting (thresholds in clippy.toml)
cognitive_complexity = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
# no-floating-result
let_underscore_future = "deny"
# banned-apis (the list is in clippy.toml)
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
# Tauri #[command] functions must take owned arguments (String) and State by value: the framework deserializes into them
needless_pass_by_value = "allow"

[lints.rust]
# warnings-are-errors, no-suppression, naming-case, no-unused, no-dead-code
