# PADE Windows 11 "modern" context-menu handler.
#
# A standalone in-process COM server (`cdylib` → `contextmenu_handler.dll`) that
# implements `IExplorerCommand`. Windows 11's modern right-click menu only reaches
# a *packaged* COM handler (package identity via a sparse MSIX manifest) - there is
# no registry shortcut, so this cannot live in the main `pade` binary. It is its
# own workspace member built with `cargo build -p contextmenu-handler`; the DLL
# lands next to `pade.exe` in the shared `target/` dir and both are pointed at by
# the sparse `AppxManifest.xml`. See `src/lib.rs` and `AppxManifest.xml`.
[package]
name = "contextmenu-handler"
version = "0.0.1"
description = "PADE Explorer context-menu COM handler (IExplorerCommand)"
authors = ["Avi"]
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "contextmenu_handler"
crate-type = ["cdylib"]

[dependencies]
# windows-rs, pinned to the same 0.62 already in the lockfile via Tauri/wry and
# webview2-com so no second copy of the crate is compiled (minimize-dependencies).
# Only the features this handler actually calls are enabled, to keep the compile
# lean.
#   windows-core       - core COM types (GUID/HRESULT/Interface/Ref/PWSTR).
#   windows-implement  - the #[implement] COM-vtable macro (its generated code
#                        references windows_core). Neither the `windows` umbrella
#                        nor `windows-core` 0.62 expose the macro via a feature, so
#                        it is pulled in directly. Versions match the lockfile
#                        (windows-core 0.62 already depends on windows-implement
#                        0.60), so no extra copies compile.
windows-core = "0.62"
windows-implement = "0.60"
#   Win32_Foundation         - HRESULT/BOOL/HMODULE + the S_*/E_*/CLASS_E_* codes
#   Win32_System_Com         - IClassFactory, IBindCtx, CoTaskMemFree
#   Win32_UI_Shell           - IExplorerCommand, IShellItem(Array), SHStrDupW, SIGDN
#   Win32_System_LibraryLoader - GetModuleFileNameW, to find pade.exe next to us
#   Win32_System_Registry    - RegGetValueW, to read the app's show/hide flag so the
#                              handler can hide itself when the toggle is off
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry"
] }

# Same strict bar as the main crate (rust-best-practices), but this crate MUST
# allow unsafe: an in-proc COM server is inherently unsafe (raw vtable pointers,
# FFI). Every other lint stays at the pedantic-with-`-D warnings` level.

# avi12-lint:begin rust-config (generated from rust-config-avi12; edit avi12-rust.local.toml)
[lints.rust]
# The COM context-menu handler is Win32 FFI
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
unused_mut = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_must_use = "deny"
dead_code = "deny"
non_camel_case_types = "deny"
non_snake_case = "deny"
non_upper_case_globals = "deny"
# narrowest-visibility
unreachable_pub = "deny"
# public-api-docs
missing_docs = "deny"
[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Documentation of Result and panics is public-API prose; missing_docs covers the rest
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
# A pedantic hint that every pure function carry #[must_use]; rustc unused_must_use covers real results
must_use_candidate = "allow"
# no-unchecked-unwrap
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
# no-unchecked-cast
as_conversions = "deny"
cast_possible_truncation = "deny"
undocumented_unsafe_blocks = "deny"
# no-suppression
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# todo-needs-owner
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# identifier-length (the idioms are in clippy.toml)
min_ident_chars = "deny"
# early-return
needless_return = "deny"
redundant_else = "deny"
collapsible_else_if = "deny"
# size-limits, max-nesting (thresholds in clippy.toml)
cognitive_complexity = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
# no-floating-result
let_underscore_future = "deny"
# banned-apis (the list is in clippy.toml)
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
# Tauri #[command] functions must take owned arguments (String) and State by value: the framework deserializes into them
needless_pass_by_value = "allow"
# The #[implement] macro expands to helper impls that trip these two pedantic lints (a reference-to-raw-pointer cast,
# #[inline(always)]); they are generated, so they cannot be fixed at their source
ref_as_ptr = "allow"
inline_always = "allow"
# avi12-lint:end
