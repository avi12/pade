# PADE process-tree snapshot shim.
#
# Finding the processes an agent started for a task needs every process's id
# and parent, plus the command lines of the agent's own descendants. Asking WMI
# through PowerShell for that costs a whole PowerShell start and most of a
# second per question, asked every few seconds while a task runs; Toolhelp and
# `NtQueryInformationProcess` answer it in about a millisecond. Both are only
# reachable through unsafe system calls, and the main `pade` crate forbids
# unsafe code, so this workspace member owns that FFI boundary (the same split
# as `process-job`). It pins the `windows` crate to the version already in the
# tree through wry, so it adds no new supply-chain surface.
[package]
name = "process-snapshot"
version = "0.0.1"
description = "Safe Windows process list and per-process command-line reads"
authors = ["Avi"]
edition = "2021"
license = "Apache-2.0"
publish = false

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = [
  "Wdk_System_Threading",
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
] }

[lints.rust]
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
unwrap_used = "deny"
expect_used = "allow"
